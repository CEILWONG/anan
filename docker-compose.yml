services:
  anan:
    image: ceilwong/anan:latest
    container_name: anan
    restart: unless-stopped
    environment:
      # 访问口令
      PASSKEY: 1111
    ports:
      # 宿主机 8080 -> 容器 3001；云主机安全组放行 8080 即可
      - "8080:3001"
    volumes:
      # 数据持久化：宿主机 /home/anan/data -> 容器 /app/data（data.md 在此），不覆盖代码目录
      - /home/anan/data:/app/data