name: Build & Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "public/**"
      - "server/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "Dockerfile"
      - ".github/workflows/**"
  workflow_dispatch: # 允许在 GitHub 页面上手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Generate timestamp tag
        id: ts
        run: echo "timestamp=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 阿里云 ACR 不支持 provenance 证明清单（vnd.oci.empty.v1+json），必须关闭
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anan:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anan:${{ steps.ts.outputs.timestamp }}
            ${{ secrets.DOCKERHUB_USERNAME }}/anan:${{ github.sha }}
            ${{ secrets.ALIYUN_REGISTRY }}/ceilwong/anan:latest
            ${{ secrets.ALIYUN_REGISTRY }}/ceilwong/anan:${{ steps.ts.outputs.timestamp }}
            ${{ secrets.ALIYUN_REGISTRY }}/ceilwong/anan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 构建推送成功后，SSH 到云主机自动拉取新镜像并重启
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cloud server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            docker compose pull
            docker compose up -d
            docker image prune -f