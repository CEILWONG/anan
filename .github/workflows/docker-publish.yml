name: Build & Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "public/**"
      - "server/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "Dockerfile"
  workflow_dispatch: # 允许在 GitHub 页面上手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate timestamp tag
        id: ts
        run: echo "timestamp=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anan:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anan:${{ steps.ts.outputs.timestamp }}
            ${{ secrets.DOCKERHUB_USERNAME }}/anan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max